body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,#302719 0%,#141312 36%,#090909 78%);display:flex;align-items:center;justify-content:center;padding:28px 16px}

.icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;flex:none}
.icon svg{width:25px;height:25px;display:block}
.fb{background:#1877f2} .tt{background:#080808;border:1px solid #555} .yt{background:#ff0033} .ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.label{text-align:right;flex:1}
.label strong{display:block;font-size:17px}
.label small{display:block;color:#bcb7ad;font-size:12px;margin-top:4px;direction:ltr;text-align:right}
.arrow{color:var(--gold);font-size:22px}
footer{margin-top:25px;color:#8e887d;font-size:11px;letter-spacing:.4px}
</style>
